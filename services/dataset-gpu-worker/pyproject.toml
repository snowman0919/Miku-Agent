[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miku-gpu-worker"
version = "0.1.0"
description = "Non-canonical reproducible GPU data worker for Miku Agent"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5"]

[project.scripts]
miku-worker = "miku_gpu_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

