[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miku-dataset-foundry"
version = "0.2.0.dev0"
description = "Rights-aware local dataset foundry for Miku Agent"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
miku-data = "miku_foundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
